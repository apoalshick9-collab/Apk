<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Splash</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:linear-gradient(160deg,#111827,#1f2937);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;overflow:hidden}
.wrap{display:flex;flex-direction:column;align-items:center;animation:slideUp 2s cubic-bezier(.22,1,.36,1) infinite}
.wrap img{width:96px;height:96px;border-radius:24px;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.wrap h1{color:#fff;font-size:32px;font-weight:700;margin-top:24px}
@keyframes slideUp{0%{opacity:0;transform:translateY(120px)}30%{opacity:1;transform:translateY(0)}80%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-40px)}}
</style>
</head>
<body>
<div class="wrap">
<img src="icon.png" alt="app icon">
<h1>__APP_NAME__</h1>
</div>
</body>
</html>
