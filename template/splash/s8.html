<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Splash</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#060913;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;overflow:hidden}
.stage{position:relative;width:280px;height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.grad{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,#7c3aed,#06b6d4,#22c55e,#f59e0b,#7c3aed);filter:blur(50px);opacity:.55;animation:spin 2s linear infinite}
.stage img{width:96px;height:96px;border-radius:24px;position:relative;z-index:1;box-shadow:0 8px 32px rgba(0,0,0,.6)}
.stage h1{color:#fff;font-size:30px;font-weight:700;margin-top:22px;position:relative;z-index:1}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="stage">
<div class="grad"></div>
<img src="icon.png" alt="app icon">
<h1>__APP_NAME__</h1>
</div>
</body>
</html>
