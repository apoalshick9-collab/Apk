<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Splash</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#08131f;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;overflow:hidden;position:relative}
.waves{position:absolute;bottom:-10px;left:0;width:100%;height:180px;overflow:hidden}
.waves svg{position:absolute;bottom:0;left:0;width:200%;height:100%}
.w1{animation:mv 4s linear infinite;opacity:.5}
.w2{animation:mv 6s linear infinite reverse;opacity:.35}
.w3{animation:mv 8s linear infinite;opacity:.25}
@keyframes mv{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.wrap{display:flex;flex-direction:column;align-items:center;z-index:1;margin-bottom:60px}
.wrap img{width:96px;height:96px;border-radius:24px;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.wrap h1{color:#fff;font-size:32px;font-weight:700;margin-top:24px}
</style>
</head>
<body>
<div class="wrap">
<img src="icon.png" alt="app icon">
<h1>__APP_NAME__</h1>
</div>
<div class="waves">
<svg class="w1" viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0,60 Q150,10 300,60 T600,60 T900,60 T1200,60 V120 H0 Z" fill="#0ea5e9"/></svg>
<svg class="w2" viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0,70 Q150,30 300,70 T600,70 T900,70 T1200,70 V120 H0 Z" fill="#0284c7"/></svg>
<svg class="w3" viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0,80 Q150,50 300,80 T600,80 T900,80 T1200,80 V120 H0 Z" fill="#0369a1"/></svg>
</div>
</body>
</html>
