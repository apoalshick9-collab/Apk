<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Splash</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#0a0a0f;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;overflow:hidden;position:relative}
.scan{position:absolute;inset:0;pointer-events:none;z-index:5;
background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 2px,transparent 2px 4px)}
.sweep{position:absolute;left:0;width:100%;height:70px;z-index:6;pointer-events:none;
background:linear-gradient(180deg,transparent,rgba(0,255,180,.14),transparent);animation:scan 2s linear infinite}
@keyframes scan{0%{top:-70px}100%{top:100%}}
.wrap{display:flex;flex-direction:column;align-items:center;z-index:1}
.wrap img{width:96px;height:96px;border-radius:24px;box-shadow:0 8px 32px rgba(0,0,0,.5);filter:saturate(1.1)}
.wrap h1{color:#4ade80;font-size:32px;font-weight:700;margin-top:24px;text-shadow:0 0 12px rgba(74,222,128,.6);font-family:'Courier New',monospace}
</style>
</head>
<body>
<div class="wrap">
<img src="icon.png" alt="app icon">
<h1>__APP_NAME__</h1>
</div>
<div class="scan"></div>
<div class="sweep"></div>
</body>
</html>
