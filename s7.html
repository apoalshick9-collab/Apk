<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Splash</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#101418;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;overflow:hidden}
img{width:96px;height:96px;border-radius:24px;box-shadow:0 8px 32px rgba(0,0,0,.5)}
h1{color:#fff;font-size:32px;font-weight:700;margin-top:24px}
.bar{width:200px;height:4px;background:rgba(255,255,255,.12);border-radius:2px;margin-top:26px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:2px;background:linear-gradient(90deg,#22d3ee,#3b82f6);animation:fill 2s ease-in-out infinite}
@keyframes fill{0%{width:0}70%{width:100%}100%{width:100%;opacity:0}}
</style>
</head>
<body>
<img src="icon.png" alt="app icon">
<h1>__APP_NAME__</h1>
<div class="bar"><i></i></div>
</body>
</html>
