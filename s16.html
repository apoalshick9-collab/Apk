<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Splash</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#050510;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;overflow:hidden}
img{width:96px;height:96px;border-radius:24px;animation:nflick 2.4s linear infinite}
h1{font-size:34px;font-weight:800;margin-top:24px;color:#fff;animation:nflick 2.4s linear infinite}
@keyframes nflick{
0%,7%,9%,54%,56%,100%{text-shadow:0 0 6px #0ff,0 0 18px #0ff,0 0 42px #0ff;box-shadow:0 0 12px #0ff,0 0 40px rgba(0,255,255,.5);opacity:1}
8%,55%{text-shadow:none;box-shadow:none;opacity:.35}}
</style>
</head>
<body>
<img src="icon.png" alt="app icon">
<h1>__APP_NAME__</h1>
</body>
</html>
