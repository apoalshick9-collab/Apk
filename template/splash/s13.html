<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Splash</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#12101a;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;overflow:hidden}
img{width:96px;height:96px;border-radius:24px;box-shadow:0 8px 32px rgba(0,0,0,.5)}
h1{color:#fff;font-size:32px;font-weight:700;margin-top:24px}
.row{display:flex;gap:12px;margin-top:28px}
.row span{width:14px;height:14px;border-radius:50%;animation:bnc 1s ease-in-out infinite}
.row span:nth-child(1){background:#f472b6;animation-delay:0s}
.row span:nth-child(2){background:#fbbf24;animation-delay:.1s}
.row span:nth-child(3){background:#34d399;animation-delay:.2s}
.row span:nth-child(4){background:#60a5fa;animation-delay:.3s}
.row span:nth-child(5){background:#a78bfa;animation-delay:.4s}
@keyframes bnc{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
</style>
</head>
<body>
<img src="icon.png" alt="app icon">
<h1>__APP_NAME__</h1>
<div class="row"><span></span><span></span><span></span><span></span><span></span></div>
</body>
</html>
