<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Splash</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#0b0d1a;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;overflow:hidden}
.stage{position:relative;width:260px;height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.blob{position:absolute;inset:10px;background:linear-gradient(135deg,#7c3aed,#06b6d4);filter:blur(2px);opacity:.8;animation:morph 4s ease-in-out infinite}
@keyframes morph{
0%,100%{border-radius:60% 40% 30% 70%/60% 30% 70% 40%;transform:rotate(0deg) scale(1)}
50%{border-radius:30% 60% 70% 40%/50% 60% 30% 60%;transform:rotate(180deg) scale(1.08)}}
.stage img{width:96px;height:96px;border-radius:24px;position:relative;z-index:1;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.stage h1{color:#fff;font-size:30px;font-weight:700;margin-top:22px;position:relative;z-index:1}
</style>
</head>
<body>
<div class="stage">
<div class="blob"></div>
<img src="icon.png" alt="app icon">
<h1>__APP_NAME__</h1>
</div>
</body>
</html>
