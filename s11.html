<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Splash</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#04121e;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;overflow:hidden}
.stage{position:relative;width:240px;height:240px;display:flex;align-items:center;justify-content:center}
.stage img{width:96px;height:96px;border-radius:24px;z-index:2;position:relative;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.wave{position:absolute;inset:72px;border:2px solid rgba(56,189,248,.6);border-radius:50%;animation:rip 2s ease-out infinite;z-index:1}
.wave:nth-child(2){animation-delay:.5s}.wave:nth-child(3){animation-delay:1s}.wave:nth-child(4){animation-delay:1.5s}
@keyframes rip{0%{transform:scale(.35);opacity:1}100%{transform:scale(1.7);opacity:0}}
h1{color:#fff;font-size:30px;font-weight:700;margin-top:4px}
</style>
</head>
<body>
<div class="stage">
<span class="wave"></span><span class="wave"></span><span class="wave"></span><span class="wave"></span>
<img src="icon.png" alt="app icon">
</div>
<h1>__APP_NAME__</h1>
</body>
</html>
