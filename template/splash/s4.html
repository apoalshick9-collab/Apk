<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Splash</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#0b0b14;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;overflow:hidden}
#fx{position:fixed;inset:0;pointer-events:none}
.wrap{display:flex;flex-direction:column;align-items:center;z-index:1}
.wrap img{width:96px;height:96px;border-radius:24px;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.wrap h1{color:#fff;font-size:32px;font-weight:700;margin-top:24px}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">
<img src="icon.png" alt="app icon">
<h1>__APP_NAME__</h1>
</div>
<script>
(function(){var c=document.getElementById('fx'),x=c.getContext('2d'),W,H,P=[],cols=['#f472b6','#60a5fa','#34d399','#fbbf24','#a78bfa'];
function rs(){W=c.width=innerWidth;H=c.height=innerHeight}
addEventListener('resize',rs);rs();
function burst(){P=[];for(var i=0;i<70;i++){var a=Math.random()*Math.PI*2,s=2+Math.random()*6;
P.push({x:W/2,y:H/2,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c:cols[i%cols.length],r:2+Math.random()*3});}}
burst();setInterval(burst,2000);
(function loop(){x.clearRect(0,0,W,H);
for(var i=0;i<P.length;i++){var p=P[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.l-=.012;
if(p.l>0){x.globalAlpha=p.l;x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill();}}
x.globalAlpha=1;requestAnimationFrame(loop);})();})();
</script>
</body>
</html>
