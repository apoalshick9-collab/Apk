<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Splash</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#08080c;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;overflow:hidden}
img{width:96px;height:96px;border-radius:24px;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.glitch{position:relative;color:#fff;font-size:34px;font-weight:800;margin-top:24px;letter-spacing:1px;animation:jit 2s steps(2) infinite}
.glitch::before,.glitch::after{content:"__APP_NAME__";position:absolute;inset:0;overflow:hidden}
.glitch::before{color:#0ff;transform:translate(-3px,-2px);clip-path:inset(20% 0 55% 0);animation:g1 2s steps(3) infinite;opacity:.85}
.glitch::after{color:#f0f;transform:translate(3px,2px);clip-path:inset(60% 0 15% 0);animation:g2 2s steps(3) infinite;opacity:.85}
@keyframes g1{0%,88%{clip-path:inset(20% 0 55% 0)}92%{clip-path:inset(5% 0 70% 0)}96%{clip-path:inset(50% 0 20% 0)}100%{clip-path:inset(20% 0 55% 0)}}
@keyframes g2{0%,88%{clip-path:inset(60% 0 15% 0)}92%{clip-path:inset(75% 0 5% 0)}96%{clip-path:inset(30% 0 45% 0)}100%{clip-path:inset(60% 0 15% 0)}}
@keyframes jit{0%,88%,100%{transform:translate(0)}90%{transform:translate(-2px,1px) skewX(2deg)}94%{transform:translate(2px,-1px)}}
</style>
</head>
<body>
<img src="icon.png" alt="app icon">
<h1 class="glitch">__APP_NAME__</h1>
</body>
</html>
