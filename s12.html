<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Splash</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#0e0d13;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;overflow:hidden}
img{width:96px;height:96px;border-radius:24px;box-shadow:0 8px 32px rgba(0,0,0,.5)}
h1{font-size:34px;font-weight:800;margin-top:24px;color:rgba(255,255,255,.92);
background:linear-gradient(110deg,#fff 40%,#fde68a 48%,#fff 56%);background-size:250% 100%;
-webkit-background-clip:text;background-clip:text;animation:shine 2s linear infinite}
@keyframes shine{0%{background-position:120% 0}100%{background-position:-120% 0}}
</style>
</head>
<body>
<img src="icon.png" alt="app icon">
<h1>__APP_NAME__</h1>
</body>
</html>
