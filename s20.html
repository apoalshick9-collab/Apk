<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Splash</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#05060f;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;overflow:hidden;position:relative}
.sky{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.spark{position:absolute;width:5px;height:5px;border-radius:50%;--dx:0px;--dy:0px;animation:boom 1.2s ease-out infinite}
@keyframes boom{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}
.wrap{display:flex;flex-direction:column;align-items:center;z-index:1}
.wrap img{width:96px;height:96px;border-radius:24px;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.wrap h1{color:#fff;font-size:32px;font-weight:700;margin-top:24px}
</style>
</head>
<body>
<div class="sky" id="sky"></div>
<div class="wrap">
<img src="icon.png" alt="app icon">
<h1>__APP_NAME__</h1>
</div>
<script>
(function(){var sky=document.getElementById('sky'),
cols=['#f472b6','#fbbf24','#34d399','#60a5fa','#a78bfa','#f87171'],
spots=[[18,22],[72,15],[50,32],[30,58],[80,52]];
for(var s=0;s<spots.length;s++)for(var i=0;i<14;i++){
var a=i/14*Math.PI*2,d=30+Math.random()*55,p=document.createElement('i');
p.className='spark';p.style.left=spots[s][0]+'%';p.style.top=spots[s][1]+'%';
p.style.background=cols[(s+i)%cols.length];
p.style.setProperty('--dx',Math.cos(a)*d+'px');p.style.setProperty('--dy',Math.sin(a)*d+'px');
p.style.animationDelay=(s*0.48)+'s';sky.appendChild(p);}})();
</script>
</body>
</html>
