<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Splash</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#0a0e1a;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;overflow:hidden}
.icon-stage{position:relative;width:200px;height:200px;display:flex;align-items:center;justify-content:center}
.icon-stage img{width:96px;height:96px;border-radius:24px;position:relative;z-index:2;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.ring{position:absolute;inset:52px;border:2px solid #38bdf8;border-radius:50%;opacity:0;animation:ring 2s ease-out infinite;z-index:1}
.ring:nth-child(2){animation-delay:.4s}.ring:nth-child(3){animation-delay:.8s}
@keyframes ring{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.8);opacity:0}}
h1{color:#fff;font-size:30px;font-weight:700;margin-top:8px}
</style>
</head>
<body>
<div class="icon-stage">
<span class="ring"></span><span class="ring"></span><span class="ring"></span>
<img src="icon.png" alt="app icon">
</div>
<h1>__APP_NAME__</h1>
</body>
</html>
