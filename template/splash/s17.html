<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Splash</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#0d0b16;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;overflow:hidden;position:relative}
.cf{position:absolute;top:-20px;width:10px;height:16px;animation:fall linear infinite;opacity:.95}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.wrap{display:flex;flex-direction:column;align-items:center;z-index:1}
.wrap img{width:96px;height:96px;border-radius:24px;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.wrap h1{color:#fff;font-size:32px;font-weight:700;margin-top:24px}
</style>
</head>
<body>
<span class="cf" style="left:5%;background:#f472b6;animation-duration:2.6s;animation-delay:0s"></span>
<span class="cf" style="left:12%;background:#fbbf24;animation-duration:3.1s;animation-delay:.4s"></span>
<span class="cf" style="left:20%;background:#34d399;animation-duration:2.8s;animation-delay:1s"></span>
<span class="cf" style="left:28%;background:#60a5fa;animation-duration:3.4s;animation-delay:.2s"></span>
<span class="cf" style="left:36%;background:#a78bfa;animation-duration:2.5s;animation-delay:1.4s"></span>
<span class="cf" style="left:44%;background:#f87171;animation-duration:3s;animation-delay:.7s"></span>
<span class="cf" style="left:52%;background:#22d3ee;animation-duration:2.7s;animation-delay:1.1s"></span>
<span class="cf" style="left:60%;background:#f472b6;animation-duration:3.2s;animation-delay:.1s"></span>
<span class="cf" style="left:68%;background:#fbbf24;animation-duration:2.9s;animation-delay:.9s"></span>
<span class="cf" style="left:76%;background:#34d399;animation-duration:3.3s;animation-delay:1.6s"></span>
<span class="cf" style="left:84%;background:#60a5fa;animation-duration:2.6s;animation-delay:.5s"></span>
<span class="cf" style="left:92%;background:#a78bfa;animation-duration:3s;animation-delay:1.2s"></span>
<div class="wrap">
<img src="icon.png" alt="app icon">
<h1>__APP_NAME__</h1>
</div>
</body>
</html>
