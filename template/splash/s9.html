<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Splash</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#0c0f1d;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;overflow:hidden;position:relative}
.float{position:absolute;bottom:-60px;color:rgba(148,163,255,.35);animation:rise linear infinite;user-select:none}
@keyframes rise{to{transform:translateY(-110vh) rotate(40deg)}}
.wrap{display:flex;flex-direction:column;align-items:center;z-index:1}
.wrap img{width:96px;height:96px;border-radius:24px;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.wrap h1{color:#fff;font-size:32px;font-weight:700;margin-top:24px}
</style>
</head>
<body>
<span class="float" style="left:8%;font-size:26px;animation-duration:5s;animation-delay:0s">⚙</span>
<span class="float" style="left:20%;font-size:18px;animation-duration:7s;animation-delay:1s">✦</span>
<span class="float" style="left:35%;font-size:30px;animation-duration:6s;animation-delay:.5s">⌁</span>
<span class="float" style="left:50%;font-size:20px;animation-duration:8s;animation-delay:2s">⚙</span>
<span class="float" style="left:65%;font-size:28px;animation-duration:5.5s;animation-delay:1.5s">✦</span>
<span class="float" style="left:78%;font-size:22px;animation-duration:7.5s;animation-delay:.8s">⌁</span>
<span class="float" style="left:90%;font-size:32px;animation-duration:6.5s;animation-delay:2.5s">⚙</span>
<div class="wrap">
<img src="icon.png" alt="app icon">
<h1>__APP_NAME__</h1>
</div>
</body>
</html>
